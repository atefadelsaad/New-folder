<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F19;--sf:#161B2E;--soft:#1e293b;--ink:#f1f5f9;--mut:#94a3b8;--ln:#334155;--pri:#6366f1;--pi:#fff;--acc:#818cf8;--accb:#312e81;--ok:#22c55e;--okb:#14532d;--bad:#ef4444;--badb:#450a0a;--r:16px;--sh:0 22px 48px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.25);--sh2:0 34px 70px rgba(0,0,0,.45),0 12px 28px rgba(0,0,0,.30);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
html{scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:rgba(100,116,139,.35) transparent}

body{background:#0B0F19;background-image:radial-gradient(900px 500px at 92% -10%,rgba(99,102,241,.12),transparent 62%),radial-gradient(760px 440px at 0% 4%,rgba(129,140,248,.18),transparent 58%),radial-gradient(820px 520px at 50% 112%,rgba(99,102,241,.10),transparent 60%);background-attachment:fixed;color:var(--ink);font:400 16px/1.7 Cairo,Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-inline-start:236px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 22px;background:rgba(22,27,46,.92);backdrop-filter:blur(16px) saturate(1.05);-webkit-backdrop-filter:blur(16px) saturate(1.05);color:var(--ink);border-top:4px solid var(--pri);border-bottom:1px solid var(--ln);box-shadow:0 10px 30px rgba(0,0,0,.35);position:relative;z-index:5}
header h1{margin:0;font-size:21px;font-weight:800;letter-spacing:0;display:flex;align-items:center;gap:10px}

nav{position:fixed;inset-block:0;inset-inline-start:0;z-index:60;display:flex;flex-direction:column;align-items:stretch;gap:4px;width:236px;padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(18px + env(safe-area-inset-bottom,0px));background:rgba(22,27,46,.92);backdrop-filter:blur(14px) saturate(1.05);-webkit-backdrop-filter:blur(14px) saturate(1.05);border-inline-end:1px solid var(--ln);overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;box-shadow:-8px 0 30px rgba(0,0,0,.35)}
nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:start;background:none;border:1px solid transparent;border-radius:10px;padding:9px 12px;font:700 14.5px Cairo,Tahoma,sans-serif;color:var(--mut);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s,box-shadow .15s}
nav:empty{display:none}
body:has(nav:empty){padding-inline-start:0}
nav button:hover{background:var(--soft);color:var(--ink)}
nav button.on{background:var(--pri);color:var(--pi);border-color:transparent;box-shadow:0 2px 6px rgba(15,23,42,.08),0 8px 20px rgba(33,118,255,.30)}

main{max-width:none;margin:0;padding:24px 24px 48px}
h2{font-size:22px;font-weight:800;margin:0 0 12px;letter-spacing:0}
h3{font-size:17px;font-weight:800;margin:0 0 10px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:18px;margin-bottom:18px;box-shadow:var(--sh)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:700;color:var(--mut)}
input,select,textarea{font-family:inherit;font-size:15.5px;font-weight:500;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:9px;padding:9px 12px;min-width:0;min-height:40px;transition:border-color .15s,box-shadow .15s}

select{cursor:pointer}
.search{width:100%;margin-bottom:14px;min-height:42px}
.searchwrap{position:relative;display:block;margin-bottom:14px}
.searchwrap .search{margin-bottom:0;padding-inline-end:46px}
.searchclear{position:absolute;inset-inline-end:7px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);background:var(--soft);color:var(--mut);font:700 17px/1 Cairo,Tahoma,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:background .15s,color .15s,border-color .15s}

.searchclear{transition:background .15s,color .15s,border-color .15s,opacity .15s}
.searchbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.searchbar .searchwrap{flex:1 1 320px;margin-bottom:0}

.nmcell{white-space:normal;min-width:260px;max-width:440px;word-break:break-word}
.nmin{min-width:280px;width:100%}
td .nmin{min-width:240px}
.noteinput{min-width:220px;width:100%;min-height:40px;resize:vertical;white-space:normal}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pri);color:var(--pi);border:1px solid transparent;border-radius:9px;padding:9px 18px;font:700 15px Cairo,Tahoma,sans-serif;cursor:pointer;white-space:nowrap;box-shadow:0 2px 6px rgba(15,23,42,.08),0 10px 24px rgba(33,118,255,.28);transition:filter .15s,transform .15s,box-shadow .15s}
.btn:hover{filter:brightness(1.04);box-shadow:0 3px 8px rgba(15,23,42,.08),0 16px 34px rgba(33,118,255,.34);transform:translateY(-1px)}
.btn:active{transform:translateY(0);box-shadow:0 1px 3px rgba(15,23,42,.10),0 5px 12px rgba(33,118,255,.22)}
.btn.ghost{background:var(--sf);color:var(--ink);border-color:var(--ln);box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 20px rgba(15,23,42,.08)}
.btn.ghost:hover{background:var(--soft);border-color:var(--pri);box-shadow:0 2px 4px rgba(15,23,42,.05),0 12px 26px rgba(15,23,42,.12)}
header .btn.ghost{background:var(--sf);border-color:var(--ln);color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 18px rgba(15,23,42,.08)}
header .btn.ghost:hover{background:var(--soft)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 8px 20px rgba(180,35,24,.24)}
.btn.bad:hover{filter:brightness(.95);box-shadow:0 12px 28px rgba(180,35,24,.30)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;margin:12px 0}
.tw{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:11px 12px;border-bottom:1px solid var(--ln);white-space:nowrap;vertical-align:middle}
th{font-weight:700;color:var(--mut);font-size:13px;background:var(--soft)}
td{font-size:15px;font-weight:500}
tbody tr:hover td{background:var(--soft)}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--accb);color:var(--acc)}
.dt{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.bad{background:var(--badb);color:var(--bad)}.chip.warn{background:#fff3cd;color:#805b00}
.bl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bc{text-align:start;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;cursor:pointer;font:inherit;color:var(--ink);box-shadow:var(--sh);transition:border-color .15s,box-shadow .15s,transform .15s}
.bc:hover{border-color:var(--pri);box-shadow:var(--sh2);transform:translateY(-2px)}
.bc b{display:flex;align-items:center;gap:8px;font-size:16px}.bc span{color:var(--mut);font-size:13px}
.mut{color:var(--mut);font-size:13.5px;line-height:1.7;font-weight:500}
.rq{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:start}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.ln{flex-direction:row;align-items:center;gap:8px;margin:4px 0}
.permission-check{flex-direction:row;align-items:center;gap:8px;margin:4px 0}.permission-check input[type=checkbox],.ln input[type=checkbox]{width:18px;height:18px;min-height:18px;padding:0;margin:0;accent-color:var(--pri);cursor:pointer}
.lg{margin-top:10px;border-inline-start:3px solid var(--ln);padding-inline-start:10px;font-size:13.5px;display:grid;gap:6px}
.cm{width:100%;margin-top:10px}
#t{position:fixed;inset-inline-start:236px;inset-inline-end:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:var(--sh2);font-size:14.5px;font-weight:600;z-index:50}
#t.show{opacity:1}
.scroll-top{position:fixed;inset-inline-end:24px;bottom:24px;z-index:40;display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid var(--ln);border-radius:50%;background:var(--pri);color:var(--pi);box-shadow:0 6px 16px rgba(0,0,0,.28);cursor:pointer;opacity:0;visibility:hidden;transform:translateY(10px) scale(.92);transition:opacity .24s ease,visibility .24s,transform .24s cubic-bezier(.2,.8,.2,1),filter .2s ease}
.scroll-top:hover{filter:brightness(1.1);transform:translateY(-2px) scale(1.05)}
.scroll-top:active{transform:translateY(0) scale(.94)}
.scroll-top svg{width:18px;height:18px}
body.scrolled .scroll-top{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
html.busy{cursor:progress}
html.busy .btn{opacity:.6;pointer-events:none}
@media (max-width:860px){
body{padding-inline-start:0;padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
nav{inset-block:auto;inset-inline:0;bottom:0;top:auto;width:auto;flex-direction:row;gap:6px;padding:8px calc(10px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px));border-inline-end:0;border-top:1px solid var(--ln);overflow-x:auto;overflow-y:hidden;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 -8px 22px rgba(30,64,175,.08)}
nav button{width:auto;flex:0 0 auto;padding:8px 12px}
#t{inset-inline-start:0;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.scroll-top{inset-inline-end:16px;bottom:calc(82px + env(safe-area-inset-bottom,0px))}
body:has(nav:empty){padding-bottom:0}
body:has(nav:empty) #t{bottom:calc(22px + env(safe-area-inset-bottom,0px))}
body:has(nav:empty) .scroll-top{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){#t,.btn,.bc,.scroll-top{transition:none}}
.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:0;color:var(--acc);margin-bottom:4px}

.sheet{border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--sf);margin-bottom:18px;box-shadow:var(--sh)}

.calc{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.calc b{color:var(--ink)}
.btn.soft{background:var(--sf);color:var(--ink);border:1px solid var(--ln);box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 20px rgba(15,23,42,.08)}
.btn.soft:hover{border-color:var(--pri);background:var(--soft);box-shadow:0 2px 4px rgba(15,23,42,.05),0 12px 26px rgba(15,23,42,.12)}
.balance{margin-bottom:18px}
.balance table{min-width:420px}
.panel{border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--sf);margin-bottom:18px;box-shadow:var(--sh)}
.panel-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px;background:var(--soft);border-bottom:1px solid var(--ln)}
.panel-head h3{margin:0}
.panel-body{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:8px}

.empty{border:1px dashed var(--ln);border-radius:10px;padding:16px;text-align:center;color:var(--mut);font-size:13.5px;font-weight:500}

/* ======================= A4 printable forms ======================= */

function dispDate(s){
  if(!s)return '';
  const raw=String(s).replace(/[\u200e\u200f\u061c]/g,'');
  let m=raw.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  const latin=raw.replace(/[٠-٩]/g,c=>ARD[c]||c);
  m=latin.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{4})/);
  return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:raw;
}
const dcell=s=>s?`<span class="dt">${e(dispDate(s))}</span>`:'';
function daysFromToday(value){
  const date=dispDate(value),match=date.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!match)return null;
  const target=Date.UTC(+match[1],+match[2]-1,+match[3]);
  const today=dispDate(isoToday()).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!today)return null;
  return Math.round((target-Date.UTC(+today[1],+today[2]-1,+today[3]))/86400000);
}

    if(!res.ok){const err=new Error(data.error||('خطأ '+res.status));err.status=res.status;setFormError(err.message);throw err}

    backdrop.className='delete-backdrop';
    backdrop.innerHTML=`<section class="delete-dialog" role="dialog" aria-modal="true" aria-labelledby="deleteTitle"><h2 id="deleteTitle">تأكيد الحذف: ${e(title)}</h2><p>${e(detail||'هذا الإجراء لا يمكن التراجع عنه.')}</p><label class="required"><span>سبب الحذف</span><textarea id="deleteReason" maxlength="500" required placeholder="اكتب سببًا واضحًا للحذف"></textarea></label><p id="deleteError" class="form-error" role="alert"></p><div class="acts" style="margin-top:14px"><button type="button" class="btn bad" id="deleteConfirm">تأكيد الحذف</button><button type="button" class="btn ghost" id="deleteCancel">إلغاء</button></div></section>`;
    document.body.appendChild(backdrop);
    const finish=value=>{
      if(value===true){
        const reason=backdrop.querySelector('#deleteReason').value.trim();
        if(!reason){const error=backdrop.querySelector('#deleteError');error.textContent='سبب الحذف مطلوب';error.classList.add('show');backdrop.querySelector('#deleteReason').focus();return}
        cleanup(reason);return;
      }
      cleanup(null);
    };
    const onKey=event=>{if(event.key==='Escape')finish(false)};
    const cleanup=value=>{document.removeEventListener('keydown',onKey);backdrop.remove();resolve(value)};
    backdrop.querySelector('#deleteConfirm').addEventListener('click',()=>finish(true));
    backdrop.querySelector('#deleteCancel').addEventListener('click',()=>finish(false));
    document.addEventListener('keydown',onKey);
    backdrop.addEventListener('click',event=>{if(event.target===backdrop)finish(false)});
    backdrop.querySelector('#deleteReason').focus();
  });
}

function notificationRows(){
  const rows=[];
  reqs.filter(r=>(r.st==='review'&&ok('review'))||(r.st==='pending'&&ok('approve'))||(r.st==='approved'&&ok('release'))).forEach(r=>{
    const status=ST[r.st]||['طلب يحتاج إجراءً',''];
    rows.push({type:'rq',title:'طلب فرع يحتاج إجراءً',detail:`${(br(r.b)||{}).n||'فرع غير معروف'} · ${status[0]} · رقم ${r.id}`,tab:'rq'});
  });
  INSPECTIONS.forEach(row=>rows.push({type:'inspection',title:'استلام بانتظار الفحص',detail:`${row.item} · إذن ${row.number} · الكمية ${row.qty}`,tab:'inspection'}));
  if(role!=='junior')items.filter(item=>item.w&&item.hw!==false&&daysFromToday(item.w)!==null&&daysFromToday(item.w)<=WARRANTY_ALERT_DAYS&&Number(item.s||0)+dist(item.id)+Number(MAINT[item.id]||0)+Number(item.held||0)>0).forEach(item=>{
    const days=daysFromToday(item.w);
    rows.push({type:'warranty',title:days<0?'ضمان منتهي':'ضمان يقترب من الانتهاء',detail:`${item.n} · ${days<0?'انتهى منذ '+Math.abs(days)+' يوم':days===0?'ينتهي اليوم':'متبقي '+days+' أيام'}`,tab:ok('stock')?'items':'dashboard'});
  });
  if(ok('maintView'))MFORMS.filter(form=>{
    if(form.status!=='sent_external')return false;
    const issue=DB.out.find(v=>Number(v.id)===Number(form.issuePermitId)||String(v.p)===String(form.issuePermitNumber));
    const sentDate=issue&&issue.d||form.deliveryDate2||form.deliveryDate||form.createdAt;
    const age=-daysFromToday(sentDate);
    return age!==null&&age>=MAINTENANCE_OVERDUE_DAYS;
  }).forEach(form=>{
    const issue=DB.out.find(v=>Number(v.id)===Number(form.issuePermitId)||String(v.p)===String(form.issuePermitNumber));
    const sentDate=issue&&issue.d||form.deliveryDate2||form.deliveryDate||form.createdAt;
    rows.push({type:'maintenance',title:'صيانة خارجية متأخرة',detail:`${form.deviceType||((it(form.itemId)||{}).n)||'جهاز'} · نموذج ${form.number||'-'} · ${-daysFromToday(sentDate)} يومًا`,tab:'mf'});
  });
  return rows;
}

async function startStocktake(){
  try{const result=await api('/stocktakes','POST',{});await refresh();openStocktake(result.stocktake.id);toast('بدأت جلسة الجرد')}catch(err){toast(err.message)}

async function saveStocktake(id){
  const entry=STOCKTAKES.find(row=>Number(row.id)===Number(id));if(!entry)return;
  const lines=[];
  for(const line of entry.lines){
    const qtyInput=document.getElementById('st_qty_'+line.item_id);
    const raw=qtyInput&&qtyInput.value.trim();
    if(raw==='')return toast('أدخل الكمية الفعلية لكل الأصناف');
    const qty=Number(raw);if(!Number.isInteger(qty)||qty<0)return toast('الكمية الفعلية يجب أن تكون عددًا صحيحًا غير سالب');
    const serialInput=document.getElementById('st_sn_'+line.item_id);
    const serials=serialInput?serialInput.value.split(/\r?\n/).map(value=>value.trim()).filter(Boolean):[];
    lines.push({item_id:line.item_id,actual_qty:qty,serials});
  }
  try{await api('/stocktakes/'+id,'PUT',{lines});await refresh();toast('تم حفظ العدّ الفعلي');go()}catch(err){toast(err.message)}
}
async function approveStocktake(id){
  if(!confirm('سيتم تعديل أرصدة المخزن إلى الكميات الفعلية المسجلة. هل تريد اعتماد التسوية؟'))return;
  try{await api('/stocktakes/'+id+'/approve','POST',{});stocktakeEditId=null;await refresh();toast('تم اعتماد تسوية الجرد');go()}catch(err){toast(err.message)}
}

const PHOTO_URLS=new Map();
async function inspectionPhotoUrl(id){
  if(PHOTO_URLS.has(id))return PHOTO_URLS.get(id);
  const response=await fetch('/api/inspection-photos/'+encodeURIComponent(id),{headers:{Authorization:'Bearer '+STATE.token}});
  if(!response.ok)throw new Error('تعذر تحميل صورة الفحص');
  const url=URL.createObjectURL(await response.blob());PHOTO_URLS.set(id,url);return url;
}
function hydrateInspectionPhotos(root){
  if(!root)return;
  root.querySelectorAll('img[data-photo-id]').forEach(img=>{
    const id=img.dataset.photoId;
    if(PHOTO_URLS.has(id)){img.src=PHOTO_URLS.get(id);return}
    if(img.dataset.loading)return;
    img.dataset.loading='1';
    inspectionPhotoUrl(id)
      .then(url=>{document.querySelectorAll('img[data-photo-id]').forEach(node=>{if(node.dataset.photoId===id)node.src=url})})
      .catch(()=>{img.alt='تعذر تحميل الصورة'});
  });
}
async function openInspectionPhoto(id){
  try{const url=await inspectionPhotoUrl(id);window.open(url,'_blank','noopener')}
  catch(err){toast(err.message)}
}

function maintenanceFormsForIssue(voucher,line){
  const serials=(line.sns||[]).map(serial=>String(serial).trim().toLowerCase()).filter(Boolean);
  return MFORMS.filter(form=>{
    if(form.requestOnly||Number(form.issuePermitId||0)&&Number(form.issuePermitId)!==Number(voucher.id))return false;
    if(form.itemId&&Number(form.itemId)!==Number(line.i))return false;
    if(form.serial&&(!serials.length||!serials.includes(String(form.serial).trim().toLowerCase())))return false;
    return !!(form.itemId||form.serial);
  });
}
function maintOutRows(){
  const remaining={...MAINT},rows=[];
  [...DB.out].reverse().forEach(r=>{
    if(r.k!='sup')return;
    r.lines.forEach(l=>{
      const rem=remaining[l.i]||0;
      if(rem<=0)return;
      const q=Math.min(l.q,rem);
      remaining[l.i]=rem-q;
      const meta=dspMeta(r.id);
      const linkedForm=MFORMS.find(f=>Number(f.id)===Number(meta.maintenanceFormId)||Number(f.issuePermitId)===Number(r.id));
      const candidates=linkedForm?[linkedForm]:maintenanceFormsForIssue(r,l);
      const form=linkedForm|| (candidates.length===1?candidates[0]:null);
      rows.push({r,l,q,form,formCandidates:candidates});
    });
  });
  return rows;
}

  if(ref)L.sns=ref.l.sns.slice(0,1);

}

function openAckForIssue(voucherId,itemId){

  if(!ref)return toast('لا توجد كمية متبقية من إذن الخروج المحدد');
  const q=ref.form&&ref.form.serial?1:Math.max(1,ref.q);
  MA={sup:ref.r.sup||'',p:'',lines:[{i:itemId,q,sns:ref.form&&ref.form.serial?[ref.form.serial]:ref.l.sns.slice(0,q),st:'stock',hw:false,wu:'',maintenanceFormId:ref.form?ref.form.id:null,sourceVoucherId:ref.r.id}]};
  fixSn(MA.lines[0]);maintView='ack';go();

  const line=MA&&MA.lines[j],ref=maintOutRows().find(row=>Number(row.r.id)===Number(voucherId)&&line&&Number(row.l.i)===Number(line.i));
  const form=ref&&maintenanceFormsForIssue(ref.r,ref.l).find(candidate=>Number(candidate.id)===Number(formId));
  if(!line||!form)return toast('نموذج الصيانة لا يطابق إذن الخروج');

function setAckQ(j,v){
  const L=MA.lines[j];

async function saveAck(){

  const p=(MA.p||'').trim();

  const seen={},used={},lines=[];
  for(const l of MA.lines){
    if(!l.i)return setFormError('اختر الصنف في كل سطر');

}

async function saveScrap(){
  if(!SCR||!SCR.lines.length)return setFormError('أضف صنفًا واحدًا على الأقل');
  const mode=SCR.mode,seen={},lines=[];
  for(const l of SCR.lines){
    if(!l.i)return setFormError('اختر الصنف في كل سطر');
    if(!(l.q>0))return setFormError('اكتب عددًا أكبر من صفر في كل سطر');
    const x=it(l.i)||{};
    if(!(x.s>0))return setFormError('لا يوجد رصيد في المخزن لهذا الصنف');
    if(l.q>x.s)return setFormError('الكمية أكبر من رصيد المخزن');
    let sns=[];
    if(mode=='serial'&&hasSer(l.i)){
      fixSn(l);sns=l.sns.map(s=>s.trim());
      for(const s of sns){const t=s.toLowerCase();if(!t)return setFormError('اكتب كل السيريالات لصنف '+x.n);if(seen[t])return setFormError('سيريال مكرر: '+s);seen[t]=1}
    }
    lines.push({item_id:+l.i,qty:+l.q,serials:sns});
  }
  try{await api('/scrap','POST',{mode,lines});scrapMode=null;SCR=null;await refresh();toast('تم تسجيل الأصناف في الخردة');go()}catch(err){toast(err.message)}
}

function compressInspectionPhoto(file){
  return new Promise((resolve,reject)=>{
    if(!['image/jpeg','image/png','image/webp'].includes(file.type))return reject(new Error('ارفع صورة JPG أو PNG أو WebP'));
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('تعذر قراءة الصورة المحددة'));
    reader.onload=()=>{
      const image=new Image();
      image.onerror=()=>reject(new Error('ملف الصورة غير صالح'));
      image.onload=()=>{
        const scale=Math.min(1,1280/Math.max(image.width,image.height));
        const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
        const context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height);
        for(const quality of [.84,.72,.58,.45]){
          const value=canvas.toDataURL('image/jpeg',quality);
          if(Math.floor((value.length-'data:image/jpeg;base64,'.length)*.75)<=1024*1024)return resolve(value);
        }
        reject(new Error('تعذر ضغط الصورة إلى أقل من 1 ميجابايت'));
      };
      image.src=String(reader.result||'');
    };
    reader.readAsDataURL(file);
  });
}
async function addInspectionPhotos(index,input){

  if(current+files.length>3){input.value='';return setFormError('يسمح بحد أقصى 3 صور لكل إذن استلام')}
  try{
    const photos=await Promise.all(files.map(compressInspectionPhoto));
    line.photoData=(line.photoData||[]).concat(photos);go();
  }catch(err){setFormError(err.message);input.value=''}
}

function resDoc(key){
  const S=DS[key],K=S.dir,sk='doc_'+key;
  const all=DB[K].filter(r=>r.k==S.kind);
  const rows=all.filter(r=>{
    if(!hit(SEARCH[sk],docMatchText(r)))return false;
    if(FILTER.docFrom&&String(r.d)<FILTER.docFrom)return false;
    if(FILTER.docTo&&String(r.d)>FILTER.docTo)return false;
    if(S.kind==='br'&&FILTER.docBranch&&String(r.b)!==String(FILTER.docBranch))return false;
    return true;
  });
  const pg=paginate(rows,PV[sk]);
  const html=rows.length?pg.rows.map(r=>docCard(key,r)).join('')+pager(sk,PV[sk],pg.p,pg.n)
    :(all.length?noRes(sk):'<p class="mut">لا توجد أذونات بعد.</p>');
  return {html,total:rows.length};
}

function vRequestEditor(){

  return `<div class="mf-page">
    <div class="mf-bar no-print">
      <div class="grp">
        <button class="btn ghost" onclick="rqBack()">رجوع للقائمة</button>
        <button class="btn" onclick="${editing?'saveRequestEdit()':'saveRequest()'}">${editing?'حفظ التعديل':(role=='junior'?'إرسال للسينيور للمراجعة':'إرسال لمدير المنطقة')}</button>
        <button class="btn soft" onclick="window.print()">طباعة</button>
      </div>
      <div class="grp"><span class="mf-no">${editing?e(reqNo):'طلب جديد'}</span></div>
    </div>

  </div>`;
}
async function saveRequestEdit(){
  if(!RQ||!editReqId)return;
  if(!br(RQ.b))return setFormError('اختر فرعًا مسجلًا','rq_branch');
  if(!RQ.lines.length)return setFormError('أضف صنفًا واحدًا على الأقل');
  const lines=[];
  for(const l of RQ.lines){
    if(!l.i)return setFormError('اختر الصنف في كل سطر');
    rqFix(l);
    lines.push({item_id:+l.i,qty:+l.q});
  }
  try{
    await api('/requests/'+editReqId+'/action','POST',{action:'save',branch_id:+RQ.b,lines,note:(RQ.note||'').trim()||'تم التعديل'});
    rqView='list';RQ=null;editReqId=null;await refresh();
    toast('تم حفظ التعديل');go();
  }catch(err){toast(err.message)}
}
async function saveRequest(){
  if(!RQ)return;
  if(!br(RQ.b))return setFormError('اختر فرعًا مسجلًا','rq_branch');
  if(!RQ.lines.length)return setFormError('أضف صنفًا واحدًا على الأقل');
  const lines=[];
  for(const l of RQ.lines){
    if(!l.i)return setFormError('اختر الصنف في كل سطر');
    rqFix(l);
    lines.push({item_id:+l.i,qty:+l.q});
  }
  try{
    await api('/requests','POST',{branch_id:+RQ.b,lines,note:(RQ.note||'').trim()});
    rqView='list';RQ=null;await refresh();
    toast(role=='junior'?'تم إرسال الطلب لمراجعة السينيور':'تم إرسال الطلب لمدير المنطقة');go();
  }catch(err){toast(err.message)}
}
function printRequest(id){
  const r=reqs.find(x=>Number(x.id)===Number(id));
  if(!r)return toast('الطلب غير موجود');
  PRINT={mode:'request',id:r.id};
  tab='docprint';go();window.scrollTo(0,0);
  setTimeout(()=>window.print(),500);
}
function printBlankRequest(){
  PRINT={mode:'requestblank'};
  tab='docprint';go();window.scrollTo(0,0);
  setTimeout(()=>window.print(),500);
}
function card(r){
  const [lb,cl]=ST[r.st],open=['review','pending','approved'].includes(r.st);
  const u=ui&&ui.id==r.id?ui.m:null;
  const lines=r.l.map(x=>`${e(it(x.i).n)} × ${x.q}`).join('، ');
  const log=r.log.length?'<div class="lg">'+r.log.map(g=>`<div><b>${e(g.by)}</b> <span class="chip ${g.k}">${e(g.a)}</span>${g.t?`<div>${e(g.t)}</div>`:''}</div>`).join('')+'</div>':'';
  const st={review:['rev','تأكيد وإرسال لمدير المنطقة','review'],pending:['ok','موافقة وإرسال لمسؤول المخزن','approve'],approved:['out','تأكيد الصرف من المخزن','release']}[r.st];
  let p='';
  if(open&&!u){
    if(st&&ok(st[2]))p+=`<button class="btn" onclick="act(${r.id},'${st[0]}')">${st[1]}</button>`;
    if(ok('reject'))p+=`<button class="btn bad" onclick="ui={id:${r.id},m:'no'};go()">رفض الطلب</button>`;
    if(ok('edit'))p+=`<button class="btn ghost" onclick="editRequest(${r.id})">تعديل الطلب</button>`;
  }
  if(open&&u=='no')p=`<input class="cm" style="margin:0" id="c${r.id}" placeholder="سبب الرفض (إجباري)"><button class="btn bad" onclick="act(${r.id},'no')">تأكيد الرفض</button><button class="btn ghost" onclick="ui=null;go()">إلغاء</button>`;
  p+=`<button class="btn soft" onclick="printRequest(${r.id})">طباعة النموذج</button>`;
  return `<div class="box"><b>${e(br(r.b).n)}</b> <span class="chip ${cl}">${lb}</span><div class="mut">${e(r.by)}</div><div style="margin-top:6px">${lines}</div>${log}${p?`<div class="acts" style="margin-top:10px;flex-wrap:wrap">${p}</div>`:''}</div>`;
}
async function send(){
  const l=Object.entries(read('rq')).map(([i,n])=>({item_id:+i,qty:n}));
  if(!l.length)return toast('اختر صنفًا واحدًا على الأقل');
  try{await api('/requests','POST',{branch_id:+$('#rb').value,lines:l,note:$('#rc').value.trim()});await refresh();toast(role=='junior'?'تم إرسال الطلب لمراجعة السينيور':'تم إرسال الطلب لمدير المنطقة');go()}catch(err){toast(err.message)}
}
async function act(id,a){
  const body={action:a};
  if(a=='no'){body.note=(($('#c'+id)||{}).value||'').trim();if(!body.note)return toast('اكتب سبب الرفض في التعليق')}
  try{
    await api('/requests/'+id+'/action','POST',body);ui=null;await refresh();
    toast(a=='out'?'تم الصرف':a=='no'?'تم رفض الطلب':a=='rev'?'تم التأكيد وإرسال الطلب لمدير المنطقة':'تمت الموافقة وإرسال الطلب لمسؤول المخزن');
    go();
  }catch(err){toast(err.message)}
}

function mfDateSync(el){
  const v=el.value?dispDate(el.value):'';
  const id=el.getAttribute('data-mirror')||('mfm_'+el.id);
  const m=document.getElementById(id);
  if(m)m.innerHTML=v?e(mfDMY(v)):'&nbsp;/&nbsp;/&nbsp;';
}
function mfDMY(v){
  const s=dispDate(v);if(!s)return '';
  const p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;
}
function mfDateCell(label,rec,key,opt){
  opt=opt||{};
  const v=rec&&rec[key]?dispDate(rec[key]):'';
  return `<div class="mf-cell ${opt.cls||''}"><span class="mf-label">${label}</span><span class="mf-date"><input class="mf-line" id="mf_${key}" type="date" value="${e(v)}" data-mirror="mfm_${key}"${opt.ro?' disabled':''} oninput="mfDateSync(this)"><span class="mirror" id="mfm_${key}">${v?e(mfDMY(v)):'&nbsp;/&nbsp;/&nbsp;'}</span></span></div>`;
}
function dspDateCell(label){
  const v=DSP&&DSP.date?dispDate(DSP.date):'';
  return `<div class="mf-cell"><span class="mf-label">${label}</span><span class="mf-date"><input class="mf-line" id="dsp_date" type="date" value="${e(v)}" data-mirror="mfm_dsp_date" oninput="mfDateSync(this);DSP.date=this.value"><span class="mirror" id="mfm_dsp_date">${v?e(mfDMY(v)):'&nbsp;/&nbsp;/&nbsp;'}</span></span></div>`;
}
function mfField(label,rec,key,opt){
  opt=opt||{};
  const v=rec&&rec[key]!=null?String(rec[key]):'';
  return `<div class="mf-cell ${opt.cls||''}"><span class="mf-label">${label}</span><input class="mf-line" id="mf_${key}" type="${opt.type||'text'}" value="${e(v)}"${opt.list?' list="'+opt.list+'"':''}${opt.attrs?' '+opt.attrs:''}${opt.ro?' disabled':''}></div>`;
}
function mfArea(label,rec,key,opt){
  opt=opt||{};
  const v=rec&&rec[key]!=null?String(rec[key]):'';
  return `<div class="mf-cell mf-block ${opt.cls||''}"><span class="mf-label">${label}</span><textarea class="mf-area" id="mf_${key}" rows="${opt.rows||2}"${opt.ro?' disabled':''}>${e(v)}</textarea></div>`;
}
function mfStamp(label){
  return `<div class="mf-cell mf-stamp"><span class="mf-label">${label}</span><span class="space"></span></div>`;
}
function mfTitleBar(title){
  const logo=LOGO?`<img class="mf-logo" src="data:image/jpeg;base64,${LOGO}" alt="شعار الشركة">`:'<span class="mf-logo" aria-label="شعار الشركة"></span>';
  return `<div class="mf-head"><div class="mf-title">${e(title)}</div>${logo}</div>`;
}
function mfSerialIndex(){
  if(window.__mfSerialIdx)return window.__mfSerialIdx;
  const map={};
  [...DB.in,...DB.out].forEach(v=>{
    (v.lines||[]).forEach(l=>{
      (l.sns||[]).forEach(sn=>{
        const key=String(sn||'').trim().toLowerCase();if(!key)return;
        const b=v.k==='br'?br(v.b):null;
        map[key]={itemId:l.i,item:it(l.i)||null,branchName:b?b.n:(v.sb||''),voucher:v,serial:String(sn).trim()};
      });
    });
  });
  window.__mfSerialIdx=map;return map;
}
function mfDatalists(rec){
  const serials=Object.values(mfSerialIndex()).map(x=>x.serial).filter(Boolean);
  if(rec&&rec.serial&&!serials.includes(rec.serial))serials.unshift(rec.serial);
  const uniq=[...new Set(serials)].slice(0,500);
  const issue=DB.out.filter(v=>v.k==='sup').map(v=>v.p);
  const entry=DB.in.filter(v=>v.k==='maint').map(v=>v.p);
  return `<datalist id="mfSerialList">${uniq.map(s=>`<option value="${e(s)}"></option>`).join('')}</datalist>
   <datalist id="mfItemList">${items.map(i=>`<option value="${e(i.n)}"></option>`).join('')}</datalist>
   <datalist id="mfBranchList">${branches.map(b=>`<option value="${e(b.n)}"></option>`).join('')}</datalist>
   <datalist id="mfIssueList">${issue.map(s=>`<option value="${e(s)}"></option>`).join('')}</datalist>
   <datalist id="mfEntryList">${entry.map(s=>`<option value="${e(s)}"></option>`).join('')}</datalist>`;
}
function mfStatusChip(status,label){
  const cls=status==='returned_to_branch'||status==='received_after_maintenance'?'ok':status==='sent_external'?'':'';
  return `<span class="chip ${cls}">${e(label||MF_STATUS_LABEL[status]||status||'-')}</span>`;
}
function mfCanEdit(){return ok('maintEdit')}
function mfBlankRecord(){
  return {id:null,number:'',maintenanceType:'internal',status:'received',itemId:null,branchId:null,branchName:'',ownerName:'',employeeCode:'',department:'',deviceType:'',serial:'',faultDescription:'',accessoriesNotes:'',deliveryDate:'',permitNumber:'',supportOfficer:'',signature:'',inspectionResult:'',receivedDate:'',inspectionDate:'',actionTaken:'',releaseToBranchDate:'',permitNumber2:'',inspector:'',signature2:'',maintenanceEntity:'',deliveryDate2:'',recipientName:'',signature3:'',warrantyStatus:'',accessoriesNotes2:'',inspector3:'',signature4:'',issuePermitNumber:'',issuePermitId:null,inspectionResult2:'',actionTaken2:'',technicianName:'',signature5:'',date3:'',inspectionResult3:'',actionTaken3:'',receivedDate2:'',maintenanceDeliveryOfficer:'',signature6:'',inspector4:'',signature7:'',entryPermitNumber:'',entryPermitId:null,receiptVoucherId:null,receiptVoucherNumber:'',dispatchLinks:[]};
}
function mfSerialPick(sn){
  if(!MF)return;
  const key=String(sn||'').trim().toLowerCase();if(!key)return;
  const info=mfSerialIndex()[key];if(!info){return}
  MF.itemId=info.itemId;
  MF.serial=info.serial;
  if(info.item){MF.deviceType=info.item.n;const d=document.getElementById('mf_deviceType');if(d)d.value=info.item.n}
  if(info.branchName){MF.branchName=info.branchName;const b=document.getElementById('mf_branchName');if(b)b.value=info.branchName}
  toast('تم تعبئة نوع الجهاز والفرع من السيريال');
}
function mfDevicePick(v){
  if(!MF)return;
  const x=items.find(i=>i.n===v);if(x)MF.itemId=x.id;
}
function mfSetDateValue(key,value){
  if(!MF)return;
  MF[key]=value||'';
  const el=document.getElementById('mf_'+key);
  if(el){el.value=value||'';mfDateSync(el)}
}
function mfPickIssue(no){
  if(!MF)return;
  const v=DB.out.find(x=>x.k==='sup'&&String(x.p)===String(no));
  if(!v){MF.issuePermitId=null;MF.issuePermitNumber=String(no||'');return}
  MF.issuePermitId=v.id;MF.issuePermitNumber=v.p;
  if(!MF.maintenanceEntity){MF.maintenanceEntity=v.sup||'';const e1=document.getElementById('mf_maintenanceEntity');if(e1)e1.value=MF.maintenanceEntity}
  if(!MF.deliveryDate2)mfSetDateValue('deliveryDate2',v.d||'');
  if(!MF.serial&&v.lines&&v.lines[0]&&v.lines[0].sns&&v.lines[0].sns[0]){
    MF.serial=v.lines[0].sns[0];MF.itemId=v.lines[0].i;
    const se=document.getElementById('mf_serial');if(se)se.value=MF.serial;
    const de=document.getElementById('mf_deviceType');if(de)de.value=(it(v.lines[0].i)||{}).n||'';
  }
  if(MF.status==='received'||MF.status==='internal_check'){
    MF.status='sent_external';
    const st=document.getElementById('mf_status');if(st)st.value=MF.status;
  }
  toast('تم ربط إذن الصرف وتعبئة الجهة');
}
function mfPickEntry(no){
  if(!MF)return;
  const v=DB.in.find(x=>x.k==='maint'&&String(x.p)===String(no));
  if(!v){MF.entryPermitId=null;MF.entryPermitNumber=String(no||'');return}
  MF.entryPermitId=v.id;MF.entryPermitNumber=v.p;
  if(!MF.receivedDate2)mfSetDateValue('receivedDate2',v.d||'');
  if(!MF.serial&&v.lines&&v.lines[0]&&v.lines[0].sns&&v.lines[0].sns[0]){

function dspInferDest(v){
  if(v.k==='br')return 'branch';

  if(linked)return 'maintenance';

function dspSuggestNumber(){
  let best=null,max=-1,width=1;
  DB.out.forEach(v=>{
    const m=String(v.p||'').match(/^(.*?)(\d+)\s*$/);if(!m)return;
    const n=parseInt(m[2],10);if(!Number.isFinite(n))return;
    if(n>max){max=n;best=m[1];width=Math.max(1,m[2].length)}
  });
  if(max<0)return '1';
  return String(best||'')+String(max+1).padStart(width,'0');
}
function dspNewLine(){

      if(!line.sns)line.sns=[];

        if(line.sns.length<line.q)line.sns.push(f.serial);else line.sns[line.sns.length-1]=f.serial;
      }
    }
    line.q=Math.max(line.q,(line.sns||[]).length,1);
    line.cond=line.cond||'يحتاج صيانة';
    line.nt=f.number?('نموذج صيانة رقم '+f.number):line.nt;
    dspFixLine(line);
  }
  toast('تم ربط نموذج الصيانة ونسخ السيريال ورقم النموذج');
  go();
}
function serialIndexLookup(sn){const key=String(sn||'').trim().toLowerCase();return key?mfSerialIndex()[key]:null}
function dspPickRequest(v){
  if(!DSP)return;
  const id=+v||0;const r=reqs.find(x=>Number(x.id)===id&&x.st==='approved');
  DSP.requestId=id||null;

  DSP.lines=r.l.map(x=>{const l={i:x.i,q:Math.max(1,+x.q||1),sns:[],cond:'سليم',nt:'طلب معتمد رقم '+r.id};dspFixLine(l);return l});
  if(!DSP.lines.length)DSP.lines.push(dspNewLine());

function dspCollect(){
  if(!DSP)return;
  const g=id=>{const el=document.getElementById(id);return el?el.value:''};
  DSP.number=g('dsp_number').trim();DSP.date=g('dsp_date')||DSP.date;
  DSP.note=g('dsp_note');DSP.stockOfficer=g('dsp_stockOfficer');DSP.stockOfficerSignature=g('dsp_stockOfficerSig');
  DSP.receiverName=g('dsp_receiverName');DSP.receiverSignature=g('dsp_receiverSig');DSP.receiveDate=g('dsp_receiveDate')||DSP.receiveDate;
  DSP.gov=g('dsp_gov');DSP.address=g('dsp_address');
}
function dspValidate(){
  if(!DSP)return 'لا يوجد إذن';
  if(!DSP.number)return 'اكتب رقم إذن الصرف';
  if(!DSP.date)return 'اختر تاريخ الإذن';
  if(DSP.destType==='branch'&&!br(DSP.branchId))return 'اختر فرعًا مسجلًا';
  if(DSP.destType!=='branch'&&!DSP.supplierName)return 'اختر الجهة المستلمة';
  if(!DSP.lines.length)return 'أضف صنفًا واحدًا على الأقل';
  const used={},seen={};
  for(const l of DSP.lines){
    if(!l.i)return 'اختر الصنف في كل سطر';
    if(!(+l.q>0))return 'اكتب الكمية في كل سطر';
    used[l.i]=(used[l.i]||0)+(+l.q);
    const avail=((it(l.i)||{}).s||0)+(DSP.original[l.i]||0);
    if(used[l.i]>avail)return 'الكمية أكبر من رصيد المخزن للصنف '+((it(l.i)||{}).n||'');
    if(hasSer(l.i)){
      if((l.sns||[]).length!==+l.q)return 'اكتب سيريال لكل قطعة من صنف '+((it(l.i)||{}).n||'');
      for(const s of l.sns){
        const t=String(s||'').trim().toLowerCase();
        if(!t)return 'اكتب كل السيريالات لصنف '+((it(l.i)||{}).n||'');
        if(seen[t])return 'سيريال مكرر: '+s;seen[t]=1;
      }
    }
  }
  return null;
}
async function dspSave(){
  if(!DSP)return;
  dspCollect();
  const err=dspValidate();if(err)return toast(err);
  const wasEdit=!!DSP.id;
  const kind=DSP.destType==='branch'?'br':'sup';
  const lines=DSP.lines.map(l=>({
    item_id:+l.i,qty:+l.q,serials:hasSer(l.i)?(l.sns||[]).map(s=>String(s).trim()):[],
    state:'stock',reason:'',note:l.nt||'',condition:l.cond||''
  }));
  const body={direction:'out',kind,number:DSP.number,doc_date:DSP.date,supplier_name:kind==='br'?'':DSP.supplierName,branch_id:kind==='br'?+DSP.branchId:null,source_branch:kind==='sup'?(DSP.destType==='maintenance'?DSP.partyName:''):'',lines};
  if(DSP.requestId&&kind==='br')body.request_id=DSP.requestId;
  try{
    const res=DSP.id?await api('/vouchers/'+DSP.id,'PUT',body):await api('/vouchers','POST',body);
    const vid=res.id||DSP.id;
    await api('/dispatch-meta/'+vid,'PUT',{destType:DSP.destType,maintenanceFormId:DSP.maintenanceFormId||null,requestId:DSP.requestId||null,note:DSP.note||'',stockOfficer:DSP.stockOfficer||'',stockOfficerSignature:DSP.stockOfficerSignature||'',receiverName:DSP.receiverName||'',receiverSignature:DSP.receiverSignature||'',receiveDate:DSP.receiveDate||'',gov:DSP.gov||'',address:DSP.address||'',partyName:DSP.partyName||''});
    if(DSP.oldMaintFormId&&Number(DSP.oldMaintFormId)!==Number(DSP.maintenanceFormId)){
      const old=MFORMS.find(f=>Number(f.id)===Number(DSP.oldMaintFormId));
      if(old){try{await api('/maintenance-forms/'+old.id,'PUT',{issuePermitId:null,issuePermitNumber:'',status:old.status==='sent_external'?'received':old.status})}catch(_){}}
    }
    if(DSP.maintenanceFormId){
      const f=MFORMS.find(x=>Number(x.id)===Number(DSP.maintenanceFormId));
      if(f){
        const links=(f.dispatchLinks||[]).filter(x=>Number(x.permitId)!==Number(vid));
        links.push({permitId:vid,permitNumber:DSP.number,date:DSP.date});
        await api('/maintenance-forms/'+f.id,'PUT',{issuePermitId:vid,issuePermitNumber:DSP.number,maintenanceEntity:DSP.supplierName||f.maintenanceEntity||'',deliveryDate2:f.deliveryDate2||DSP.date,status:'sent_external',dispatchLinks:links});
      }
    }
    await refresh();dspView='list';DSP=null;toast(wasEdit?'تم حفظ تعديل إذن الصرف':'تم تسجيل إذن الصرف وخصم الكميات من المخزن');go();
  }catch(e){toast(e.message)}
}
function dspOpen(id,print){
  const v=DB.out.find(x=>Number(x.id)===Number(id));

  const m=dspMeta(v.id);
  const dest=m.destType||dspInferDest(v);
  const b=v.k==='br'?br(v.b):null;
  const sup=suppliers.find(s=>s.n===v.sup);
  const d={id:v.id,destType:dest,number:v.p,date:v.d||isoToday(),branchId:v.b||null,supplierName:v.sup||'',partyName:dspPartyOf(v)||m.partyName||'',gov:m.gov||(b?b.g:''),address:m.address||(b?(b.address||''):(sup?(sup.address||''):'')),note:m.note||'',stockOfficer:m.stockOfficer||v.by||'',stockOfficerSignature:m.stockOfficerSignature||'',receiverName:m.receiverName||dspPartyOf(v)||'',receiverSignature:m.receiverSignature||'',receiveDate:m.receiveDate||v.d||isoToday(),maintenanceFormId:m.maintenanceFormId||null,oldMaintFormId:m.maintenanceFormId||null,requestId:m.requestId||null,original:{},lines:[]};
  (v.lines||[]).forEach(l=>{d.original[l.i]=(d.original[l.i]||0)+(+l.q||0);d.lines.push({i:l.i,q:l.q,sns:[...(l.sns||[])],cond:l.cd||'سليم',nt:l.nt||''})});
  if(!d.lines.length)d.lines.push(dspNewLine());

}

let PRINT=null;
function printVoucher(key,id){
  const rec=DB[DS[key].dir].find(x=>Number(x.id)===Number(id)&&x.k===DS[key].kind);
  if(!rec)return toast('الإذن غير موجود');
  PRINT={mode:'voucher',key,id:rec.id};
  tab='docprint';go();window.scrollTo(0,0);
  setTimeout(()=>window.print(),500);
}
function printScrap(id){
  const r=SCRAPLOG.find(x=>Number(x.id)===Number(id));
  if(!r)return toast('حركة الخردة غير موجودة');
  PRINT={mode:'scrap',id:r.id};
  tab='docprint';go();window.scrollTo(0,0);
  setTimeout(()=>window.print(),500);
}
function printBlankDoc(key){
  PRINT={mode:'blank',key};
  tab='docprint';go();window.scrollTo(0,0);
  setTimeout(()=>window.print(),500);
}
function printBlankScrap(){
  PRINT={mode:'scrapblank'};
  tab='docprint';go();window.scrollTo(0,0);
  setTimeout(()=>window.print(),500);
}
function backFromPrint(){
  const p=PRINT;PRINT=null;
  tab=!p?'rq':((p.mode==='scrap'||p.mode==='scrapblank')?'scrap':(p.mode==='request'||p.mode==='requestblank')?'rq':p.key);
  go();
}
function vDocPrint(){
  if(!PRINT)return '<p class="mut">لا يوجد مستند للطباعة.</p>';
  let sheet='';
  if(PRINT.mode==='scrap')sheet=scrapDocSheet(PRINT.id,false);
  else if(PRINT.mode==='scrapblank')sheet=scrapDocSheet(0,true);
  else if(PRINT.mode==='blank')sheet=voucherDocSheet(PRINT.key,0,true);
  else if(PRINT.mode==='request')sheet=requestDocSheet(PRINT.id,false);
  else if(PRINT.mode==='requestblank')sheet=requestDocSheet(0,true);
  else sheet=voucherDocSheet(PRINT.key,PRINT.id,false);
  if(!sheet)return '<p class="mut">تعذر العثور على المستند.</p>';
  return `<div class="mf-page">
    <div class="mf-bar no-print">
      <div class="grp"><button class="btn ghost" onclick="backFromPrint()">رجوع</button><button class="btn soft" onclick="window.print()">طباعة</button></div>
      <span class="mf-no">${(PRINT.mode==='blank'||PRINT.mode==='scrapblank'||PRINT.mode==='requestblank')?'نموذج فارغ':'معاينة الطباعة'}</span>
    </div>
    <div class="print-root"><div class="paper-wrap"><div class="paper-sheet">${sheet}</div></div></div>
  </div>`;
}
function vfCell(label,value){
  const v=value===undefined||value===null||value===''?'&nbsp;':e(String(value));
  return `<div class="mf-cell"><span class="mf-label">${e(label)}</span><span class="mf-val">${v}</span></div>`;
}
function vfDate(label,value){
  return `<div class="mf-cell"><span class="mf-label">${e(label)}</span><span class="mf-val">${value?e(mfDMY(value)):'&nbsp;/&nbsp;/&nbsp;'}</span></div>`;
}
function vfFill(cols,n){
  let h='';
  for(let i=0;i<n;i++)h+=`<tr class="fill">${cols.map(()=>'<td>&nbsp;</td>').join('')}</tr>`;
  return h;
}
function vfSignRow(firstName,secondLabel,secondName,dateLabel,date,firstLabel,firstSignature,secondSignature){
  return `<div class="mf-row" style="grid-template-columns:1.45fr 1.45fr 1fr 1.35fr">
    <div class="mf-cell"><div class="mf-stack"><div class="sub"><span class="mf-label">${e(firstLabel||'مسؤول المخزن')}</span><span class="mf-val">${firstName?e(firstName):'&nbsp;'}</span></div><div class="sub"><span class="mf-label">التوقيع</span><span class="mf-val">${firstSignature?e(firstSignature):'&nbsp;'}</span></div></div></div>
    <div class="mf-cell"><div class="mf-stack"><div class="sub"><span class="mf-label">${e(secondLabel)}</span><span class="mf-val">${secondName?e(secondName):'&nbsp;'}</span></div><div class="sub"><span class="mf-label">التوقيع</span><span class="mf-val">${secondSignature?e(secondSignature):'&nbsp;'}</span></div></div></div>
    <div class="mf-cell"><div class="mf-stack"><div class="sub"><span class="mf-label">${e(dateLabel)}</span></div><div class="sub"><span class="mf-val">${date?e(mfDMY(date)):'&nbsp;/&nbsp;/&nbsp;'}</span></div></div></div>
    ${mfStamp('ختم مخزن النظم')}
  </div>`;
}
function voucherDocSheet(key,id,blank){
  const rec=blank?{id:0,k:DS[key].kind,p:'',d:'',b:null,sup:'',by:'',lines:[]}:DB[DS[key].dir].find(x=>Number(x.id)===Number(id));
  if(!rec)return '';
  const isIn=DS[key].dir==='in';
  const b=rec.b?br(rec.b):null;
  const sup=suppliers.find(s=>s.n===rec.sup)||null;
  const partyLbl=key==='recvsup'?'المورد':key==='issbr'?'الفرع المستلم':'الفرع';
  const party=blank?'':(partyName(rec)||'');
  const m=blank?{}:dspMeta(rec.id);
  const gov=key==='recvsup'?(m.gov||''):(m.gov||((b&&b.g)||''));
  const addr=key==='recvsup'?(m.address||(sup?(sup.address||''):'')):(m.address||((b&&b.address)||''));
  const cols=isIn?['م','التصنيف','اسم الصنف','السيريال','الكمية','الحالة','الضمان','ملاحظات']:['م','التصنيف','اسم الصنف','السيريال','الكمية','الحالة','ملاحظات'];
  const widths=isIn?['4%','12%','20%','22%','6%','9%','15%','12%']:['4%','13%','24%','28%','7%','12%','12%'];
  const rows=rec.lines.map((l,j)=>{
    const x=it(l.i)||{};
    const cells=[`<td>${j+1}</td>`,`<td>${e(x.c||'-')}</td>`,`<td style="text-align:right">${e(x.n||'-')}</td>`,
      `<td>${l.sns&&l.sns.length?e(l.sns.join('، ')):'بدون سيريال'}</td>`,`<td><b>${l.q}</b></td>`,
      `<td>${e(isIn?(SM[l.st]||SM.stock):(l.cd||'سليم'))}</td>`];
    if(isIn)cells.push(`<td>${l.hw?('بضمان'+(l.wu?' حتى '+mfDMY(l.wu):'')):'بدون ضمان'}</td>`);
    cells.push(`<td style="text-align:right">${e(l.nt||'')}</td>`);
    return `<tr>${cells.join('')}</tr>`;
  }).join('');
  const minRows=22;
  const note=m.note||rec.lines.map(l=>l.nt).filter(Boolean).join(' | ');
  const dateLbl=isIn?'تاريخ الاستلام':'تاريخ التسليم';
  const secondLbl=key==='issbr'?'الموظف المستلم':key==='recvsup'?'المورد / المسلّم':isIn?'مسؤول الفرع':'اسم المستلم';
  const secondName=m.receiverName||(isIn?party:((b&&b.manager)||''));
  return `${mfTitleBar(VFORM_TITLE[key]||DS[key].t)}
    <div class="mf-sec"><div class="mf-sec-head">بيانات الإذن</div><div class="mf-table">
      <div class="mf-row" style="grid-template-columns:1.1fr 1fr 1.6fr 1.55fr">
        ${vfCell('رقم الإذن',rec.p)}
        ${vfDate('التاريخ',rec.d)}
        ${vfCell(partyLbl,party)}
        ${vfCell('المسؤول',m.stockOfficer||rec.by)}
      </div>
      <div class="mf-row" style="grid-template-columns:.9fr 2.6fr">
        ${vfCell('المحافظة',gov)}
        ${vfCell('العنوان',addr)}
      </div>
     </div></div>
    <div class="mf-sec"><div class="mf-sec-head">بيانات الأصناف</div>
      <table class="dsp-table"><colgroup>${widths.map(w=>`<col style="width:${w}">`).join('')}</colgroup>
       <thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
       <tbody>${rows}${vfFill(cols,Math.max(0,minRows-rec.lines.length))}</tbody></table>
     </div>
    <div class="mf-sec"><div class="mf-sec-head">ملاحظات</div><div class="mf-table"><div class="mf-row" style="grid-template-columns:1fr"><div class="mf-cell mf-block"><textarea class="mf-area" rows="6" readonly>${e(note)}</textarea></div></div></div></div>
    <div class="mf-sec"><div class="mf-sec-head">${key==='issbr'&&m.giverName?'تسليم العهدة بين الموظفين':'التسليم والاستلام'}</div><div class="mf-table">
      ${key==='issbr'&&m.giverName?vfSignRow(m.giverName,secondLbl,secondName,dateLbl,m.receiveDate||rec.d,'الموظف المُسلِّم',m.giverSignature,m.receiverSignature):vfSignRow(rec.by,secondLbl,secondName,dateLbl,rec.d)}
     </div></div>`;
}
function scrapDocSheet(id,blank){
  const r=blank?{id:0,i:0,q:'',sns:[],by:'',at:''}:SCRAPLOG.find(x=>Number(x.id)===Number(id));
  if(!r)return '';
  const x=blank?{}:(it(r.i)||{});
  const when=logParts(r.at);
  const cols=['م','التصنيف','اسم الصنف','السيريال','الكمية','ملاحظات'];
  const widths=['5%','15%','28%','30%','8%','14%'];
  const serials=blank?'':((r.sns||[]).length?e(r.sns.join('، ')):'بدون سيريال');
  return `${mfTitleBar('نموذج خردة / إتلاف أصناف')}
    <div class="mf-sec"><div class="mf-sec-head">بيانات المحضر</div><div class="mf-table">
      <div class="mf-row" style="grid-template-columns:1.1fr 1fr .9fr 1.7fr">
        ${vfCell('رقم المحضر',blank?'':'SCR-'+String(r.id).padStart(4,'0'))}
        ${vfDate('التاريخ',when.d)}
        ${vfCell('الوقت',when.t)}
        ${vfCell('المسؤول',r.by)}
      </div>
      <div class="mf-row" style="grid-template-columns:1fr 2.9fr">
        ${vfCell('المصدر','المخزن')}
        ${vfCell('سبب الإتلاف / ملاحظات','')}
      </div>
     </div></div>
    <div class="mf-sec"><div class="mf-sec-head">الأصناف</div>
      <table class="dsp-table tall"><colgroup>${widths.map(w=>`<col style="width:${w}">`).join('')}</colgroup>
       <thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
       <tbody>
         <tr><td>1</td><td>${e(x.c||'')}</td><td style="text-align:right">${e(x.n||'')}</td><td>${serials}</td><td>${r.q===''?'':'<b>'+r.q+'</b>'}</td><td style="text-align:right"></td></tr>
         ${vfFill(cols,17)}
       </tbody></table>
     </div>
    <div class="mf-sec"><div class="mf-sec-head">ملاحظات</div><div class="mf-table"><div class="mf-row" style="grid-template-columns:1fr"><div class="mf-cell mf-block"><textarea class="mf-area" rows="4" readonly></textarea></div></div></div></div>
    <div class="mf-sec"><div class="mf-sec-head">التسليم والاعتماد</div><div class="mf-table">
      ${vfSignRow(r.by,'المدير الفني','','تاريخ الإتلاف',when.d)}
     </div></div>`;
}
function requestDocSheet(id,blank){
  const r=blank?null:reqs.find(x=>Number(x.id)===Number(id));
  if(!blank&&!r)return '';
  const b=r?br(r.b):null;
  const st=r?(ST[r.st]||['',''])[0]:'';
  const logs=r?(r.log||[]):[];
  const last=logs.length?logs[logs.length-1]:null;
  const cols=['م','التصنيف','اسم الصنف','الكمية المطلوبة'];
  const widths=['6%','18%','54%','22%'];
  const rows=(r?r.l:[]).map((l,j)=>{
    const x=it(l.i)||{};
    return `<tr><td>${j+1}</td><td>${e(x.c||'-')}</td><td style="text-align:right">${e(x.n||'-')}</td><td><b>${l.q}</b></td></tr>`;
  }).join('');
  return `${mfTitleBar('نموذج طلب أصناف')}
    <div class="mf-sec"><div class="mf-sec-head">بيانات الطلب</div><div class="mf-table">
      <div class="mf-row" style="grid-template-columns:1fr 1fr 1.6fr 1.4fr">
        ${vfCell('رقم الطلب',r?('REQ-'+String(r.id).padStart(4,'0')):'')}
        ${vfDate('التاريخ',r?r.d:'')}
        ${vfCell('الفرع',r?((b&&b.n)||''):'')}
        ${vfCell('مقدّم الطلب',r?r.by:'')}
      </div>
      <div class="mf-row" style="grid-template-columns:1fr 2.6fr">
        ${vfCell('الحالة',st)}
        ${vfCell('آخر إجراء',last?((last.by||'')+' — '+(last.a||'')):'')}
      </div>
     </div></div>
    <div class="mf-sec"><div class="mf-sec-head">الأصناف المطلوبة</div>
      <table class="dsp-table"><colgroup>${widths.map(w=>`<col style="width:${w}">`).join('')}</colgroup>
       <thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
       <tbody>${rows}${vfFill(cols,Math.max(0,20-(r?r.l.length:0)))}</tbody></table>
     </div>
    <div class="mf-sec"><div class="mf-sec-head">ملاحظات</div><div class="mf-table"><div class="mf-row" style="grid-template-columns:1fr"><div class="mf-cell mf-block"><textarea class="mf-area" rows="4" readonly>${e(last?(last.t||''):'')}</textarea></div></div></div></div>
    <div class="mf-sec"><div class="mf-sec-head">الاعتماد</div><div class="mf-table">
      ${vfSignRow(r?r.by:'','مدير المنطقة','','تاريخ الطلب',r?r.d:'','مقدّم الطلب')}
     </div></div>`;
}
const DAT={stock:resStock,items:resItems,sup:resSup,cats:resCats,br:resBranches,britems:resBritems,rq:resRq,reqbr:resReqb,scrap:resScrap,maint:()=>maintView==='release'?resMaintRel():resMaintMain(),doc_recvsup:()=>resDoc('recvsup'),doc_recvbr:()=>resDoc('recvbr'),doc_issbr:()=>resDoc('issbr'),doc_issmaint:()=>resDoc('issmaint'),mf:resMaintForms,dispatch:resDispatch};
boot();
</script>
</body>
