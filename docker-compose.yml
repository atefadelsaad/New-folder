services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
      MSSQL_PID: "Developer"
    volumes:
      - mssql_data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  app:
    build: .
    environment:
      DB_SERVER: db
      DB_PORT: "1433"
      DB_NAME: it_warehouse
      DB_USER: sa
      DB_PASSWORD: "Your_password123"
      DB_ENCRYPT: "false"
      JWT_SECRET: change-me-in-production
      PORT: "3002"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3002"

volumes:
  mssql_data:
